name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Set the BACKEND_URL repository variable (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi
          # Retry so a cold start (30-60s) still counts as a success.
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "$BACKEND_URL" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
